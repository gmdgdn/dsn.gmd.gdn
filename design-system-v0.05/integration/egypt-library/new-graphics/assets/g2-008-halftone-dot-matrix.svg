<svg id="g2-008-halftone-dot-matrix-root" xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="g2-008-halftone-dot-matrix-title g2-008-halftone-dot-matrix-desc"><style>#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-paperfill{fill:#F7F4EF;fill:var(--gmd-paper,#F7F4EF)}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-inkfill{fill:#140206;fill:var(--gmd-ink,#140206)}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-nilefill{fill:#1034A6;fill:var(--gmd-nile,#1034A6)}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-pinkfill{fill:#FF6183;fill:var(--gmd-accent,#FF6183)}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-tealfill{fill:#176F73;fill:var(--gmd-ornament-teal,#176F73)}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-ochrefill{fill:#8B661E;fill:var(--gmd-ornament-ochre,#8B661E)}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-terracottafill{fill:#9C4937;fill:var(--gmd-ornament-terracotta,#9C4937)}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-sandfill{fill:#D5C4A8;fill:var(--gmd-sand,#D5C4A8)}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-inkline{fill:none;stroke:#140206;stroke:var(--gmd-ink,#140206);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-nileline{fill:none;stroke:#1034A6;stroke:var(--gmd-nile,#1034A6);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-tealline{fill:none;stroke:#176F73;stroke:var(--gmd-ornament-teal,#176F73);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-ochreline{fill:none;stroke:#8B661E;stroke:var(--gmd-ornament-ochre,#8B661E);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-terracottaline{fill:none;stroke:#9C4937;stroke:var(--gmd-ornament-terracotta,#9C4937);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}#g2-008-halftone-dot-matrix-root .g2-008-halftone-dot-matrix-whiteline{fill:none;stroke:#F7F4EF;stroke:var(--gmd-paper,#F7F4EF);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}</style><title id="g2-008-halftone-dot-matrix-title">G2-008 — regularized halftone dot matrix</title><desc id="g2-008-halftone-dot-matrix-desc">Contemporary regular dot cell informed by a dense printed halftone source. The source’s irregular dots are not reproduced; this 16-unit translation cell is mathematically seamless.</desc><defs><pattern id="g2-008-halftone-dot-matrix-dot-cell" patternUnits="userSpaceOnUse" width="16" height="16"><circle class="g2-008-halftone-dot-matrix-inkfill" cx="4" cy="4" r="1.6"/><circle class="g2-008-halftone-dot-matrix-inkfill" cx="12" cy="12" r="1.6"/></pattern></defs><g id="g2-008-halftone-dot-matrix-periodic-dot-field" aria-label="regularized halftone field"><rect x="0" y="0" width="128" height="128" fill="url(#g2-008-halftone-dot-matrix-dot-cell)" style="fill:url(#g2-008-halftone-dot-matrix-dot-cell)"/></g><g id="g2-008-halftone-dot-matrix-source-texture-note-window"><rect class="g2-008-halftone-dot-matrix-paperfill" x="35" y="35" width="58" height="58" stroke="#1034A6" stroke-width="1.2"/></g></svg>
