<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc" width="600" height="760">
<title id="title">Editorial portrait frame and side rails</title><desc id="desc">Editable editorial frame study retaining source's side diamond rails, zigzag scroll-heading zone, heavy side fields around a replaceable portrait opening, and copy lines. Source portrait and Arabic article text are not traced. Source G3-019.</desc>
<metadata>Source G3-019. contemporary study; editable named groups; no embedded raster.</metadata>
