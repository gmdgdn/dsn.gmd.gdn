<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc" width="600" height="760">
<title id="title">Ornate chair collection (upright)</title><desc id="desc">Editable furniture study based on the sideways source, rotated to put chair feet down and backs up. Repeated tall chair backs, seat aprons, legs, finials and inset panels remain individually grouped; these are chairs, not buildings. Source G3-017.</desc>
<metadata>Source G3-017. contemporary study; editable named groups; no embedded raster.</metadata>
<style>:root{--ink:#140206;--nile:#1034a6;--paper:#f1e5d0;--ochre:#b77b39;--red:#9c4937;--pale:#e2d4bc}.ink{stroke:var(--ink);fill:none} .inkfill{fill:var(--ink)} .paperfill{fill:var(--paper)} .nilefill{fill:var(--nile)} .ochrefill{fill:var(--ochre)} .redfill{fill:var(--red)} .line{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .fine{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round} .muted{stroke:var(--ink);stroke-width:2;fill:none;opacity:.2} .stipple{fill:var(--ochre)}</style>
