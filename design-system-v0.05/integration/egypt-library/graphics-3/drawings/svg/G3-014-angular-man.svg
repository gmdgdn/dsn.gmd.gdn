<title id="title">Elongated angular man with subdued surrounding figures</title><desc id="desc">Source-informed editable vector study following the supplied abstract man: face at top, dark right-face edge, raised left arm, long pointed legs and a netted heart-like chest panel. Surrounding figures are separate and dimmed. Not a bird or architectural reconstruction. Source G3-014.</desc>
