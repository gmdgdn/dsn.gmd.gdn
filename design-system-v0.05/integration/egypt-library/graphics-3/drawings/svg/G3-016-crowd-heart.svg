<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc" width="600" height="760">
<title id="title">Rotated crowd-heart composition</title><desc id="desc">Editable contemporary vector study of the supplied dense ornamental heart, rotated so the point faces down. A distinct central group is surrounded by many small faces; details are simplified and not an exact trace. Source G3-016.</desc>
<metadata>Source G3-016. contemporary study; editable named groups; no embedded raster.</metadata>
