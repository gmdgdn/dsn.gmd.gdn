<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" role="img" aria-labelledby="title desc" width="600" height="760">
<title id="title">Seven-gore headdress and long patterned gown</title><desc id="desc">Contemporary editable vector study following the supplied woman: seven straight triangular headdress gores with dense V-shaped chord hatching and nested rim triangles; pebble-pattern side ovals; long narrow diamond-pattern gown, quiet elongated face and hands at hem. It is source-informed, not an exact trace. Source G3-013.</desc>
