<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" role="img" aria-labelledby="title desc" width="600" height="760">
<title id="title">Seven-gore headdress and long patterned gown</title><desc id="desc">Contemporary editable vector study following the supplied woman: 470-unit seven-wedge disk above a narrow 74-unit gown, dense straight V-shaped chord hatching and nested rim triangles; hanging pebble-pattern side ovals; small elongated framed face; narrow diamond-pattern gown, long arms and hands at hem. Source proportions are interpreted, not traced. Source G3-013.</desc>
<metadata>Source G3-013. contemporary study; editable named groups; no embedded raster.</metadata>
