<title id="title">Source-traced letterform portrait</title><desc id="desc">Source-traced contour study. Each compound ink path is editable as a group; small source details are preserved as contours without assigning anatomy or provenance. Vectorized from a cropped, thresholded view of G3-011; full-resolution original is linked beside the SVG. This is a visual source-trace, not an independently verified historical reconstruction. Source G3-011.</desc>
<metadata>Source G3-011. contemporary study; editable named groups; no embedded raster.</metadata>
