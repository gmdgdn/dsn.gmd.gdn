<svg xmlns="http://www.w3.org/2000/svg" id="kh-p03-fluted-dentil-rosette-frieze" viewBox="0 0 720 300" role="img" aria-labelledby="kh-p03-fluted-dentil-rosette-frieze-title kh-p03-fluted-dentil-rosette-frieze-desc"><title id="kh-p03-fluted-dentil-rosette-frieze-title">Building 01 — fluted dentil and rosette frieze</title><desc id="kh-p03-fluted-dentil-rosette-frieze-desc">Closeup-derived cornice band with fine vertical flutes, aligned dentil marks and a centered radial rosette. Exact unit width 144 and height 90.</desc><style>.line{fill:none;stroke:#140206;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#140206;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.bold{fill:none;stroke:#140206;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#1034A6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.warm{fill:#D5C4A8;stroke:#140206;stroke-width:1.5;stroke-linejoin:round}.paper{fill:#F7F4EF;stroke:#140206;stroke-width:1.6;stroke-linejoin:round}.inkfill{fill:#140206}.nilefill{fill:#1034A6}.terrafill{fill:#9C4937}</style><defs><pattern id="p" width="144" height="90" patternUnits="userSpaceOnUse"><g class="fine"><path d="M0 12H144 M0 74H144 M0 82H144"/><path d="M4 18V68 M12 18V68 M20 18V68 M28 18V68 M36 18V68 M44 18V68 M52 18V68 M60 18V68 M68 18V68 M76 18V68 M84 18V68 M92 18V68 M100 18V68 M108 18V68 M116 18V68 M124 18V68 M132 18V68 M140 18V68"/><path d="M0 16v8m12-8v8m12-8v8m12-8v8m12-8v8m12-8v8m12-8v8m12-8v8m12-8v8m12-8v8m12-8v8m12-8v8"/><circle cx="72" cy="44" r="20"/><circle cx="72" cy="44" r="7"/><path d="M72 19v8m0 34v8M47 44h8m34 0h8M54 26l6 6m24 24 6 6m0-36-6 6M60 56l-6 6"/></g></pattern></defs><rect x="14" y="14" width="692" height="132" fill="url(#p)" stroke="#140206"/><rect x="18" y="164" width="144" height="90" fill="#F7F4EF" stroke="#1034A6"/><g transform="translate(18 164)"><g class="fine"><path d="M0 12H144 M0 74H144 M0 82H144"/><path d="M4 18V68 M12 18V68 M20 18V68 M28 18