<svg xmlns="http://www.w3.org/2000/svg" id="kh-p05-nested-pointed-window-arch" viewBox="0 0 720 330" role="img" aria-labelledby="kh-p05-nested-pointed-window-arch-title kh-p05-nested-pointed-window-arch-desc"><title id="kh-p05-nested-pointed-window-arch-title">Building 02 — nested pointed window surround</title><desc id="kh-p05-nested-pointed-window-arch-desc">Closeup-derived single pointed window surround with five concentric archivolts, narrow double-leaf glazing and an upper rosette. This is a bounded ornamental frame, not a repeat tile.</desc><style>.line{fill:none;stroke:#140206;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#140206;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.bold{fill:none;stroke:#140206;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#1034A6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.warm{fill:#D5C4A8;stroke:#140206;stroke-width:1.5;stroke-linejoin:round}.paper{fill:#F7F4EF;stroke:#140206;stroke-width:1.6;stroke-linejoin:round}.inkfill{fill:#140206}.nilefill{fill:#1034A6}.terrafill{fill:#9C4937}</style><g transform="translate(0 0)" aria-label="Three concentric pointed archivolts around a small window"><path class="line" d="M30 286V128L180 28L330 128V286Z"/><path class="fine" d="M54 286V139L180 55L306 139V286Z M78 286V151L180 82L282 151V286Z M102 286V164L180 109L258 164V286Z M126 286V177L180 139L234 177V286Z"/><path class="fine" d="M144 286V190L180 164L216 190V286Z M148 224H212 M180 190V286 M152 246H208 M152 266H208"/><path class="fine" d="M54 286H306 M30 292H330"/><circle class="line" cx="180" cy="38" r="8"/><circle class="fine" cx="180" cy="38" r="3"/></g><text x="370" y="82" fill="#140206" font-size="17">NESTED ARCH</text><text x="370" y="112" fill="#140206" font-size="13">Bounded surround study</text><text x="370" y="145" fill="#140206" font-size="12">Five stepped archivolts trace the pointed window recess; the center is one opening, not a tiling unit.</text></svg>