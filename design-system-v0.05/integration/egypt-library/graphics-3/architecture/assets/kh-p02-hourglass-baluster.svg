<svg xmlns="http://www.w3.org/2000/svg" id="kh-p02-hourglass-baluster" viewBox="0 0 720 300" role="img" aria-labelledby="kh-p02-hourglass-baluster-title kh-p02-hourglass-baluster-desc"><title id="kh-p02-hourglass-baluster-title">Building 01 — round hourglass baluster</title><desc id="kh-p02-hourglass-baluster-desc">Closeup-derived turned baluster: circular central belly, narrow necks, and repeated horizontal rails. The unit meets matching rails and posts at both horizontal edges.</desc><style>.line{fill:none;stroke:#140206;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#140206;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.bold{fill:none;stroke:#140206;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.accent{fill:none;stroke:#1034A6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.warm{fill:#D5C4A8;stroke:#140206;stroke-width:1.5;stroke-linejoin:round}.paper{fill:#F7F4EF;stroke:#140206;stroke-width:1.6;stroke-linejoin:round}.inkfill{fill:#140206}.nilefill{fill:#1034A6}.terrafill{fill:#9C4937}</style><defs><pattern id="p" width="90" height="120" patternUnits="userSpaceOnUse"><g class="line"><path d="M0 16H90 M0 108H90 M0 114H90"/><path d="M0 20V108 M90 20V108"/><path d="M12 24H78 M12 100H78"/><path d="M45 25C33 34 34 47 41 55C25 61 25 75 36 82C40 87 40 94 38 101H52C50 94 50 87 54 82C65 75 65 61 49 55C56 47 57 34 45 25Z"/><circle cx="45" cy="64" r="13"/><path d="M45 25v-7m0 83v10"/></g></pattern></defs><rect x="14" y="14" width="692" height="132" fill="url(#p)" stroke="#140206"/><rect x="18" y="164" width="90" height="120" fill="#F7F4EF" stroke="#1034A6"/><g transform="translate(18 164)"><g class="line"><path d="M0 16H90 M0 108H90 M0 114H90"/><path d="M0 20V108 M90 20V108"/><path d="M12 24H78 M12 100H78"/><path d="M45 25C33 34 34 47 41 55C25 61 25 75 36 82C40 87 40 94 38 101H52C50 94 50 87 54 82C65 75 65 61 49 55C56 47 57 34 45 25Z"/><circle cx="45" cy="64" r="13"/><path d="M45 25v-7m0 83v10"/></g></g><text x="142" y="205" fill="#140206" font-size="15">ONE 90 × 120 UNIT</text><text x="142" y="232" fill="#140206" font-size="12">Round central spindle, pinched necks and continuous upper/lower rails.</text></svg>