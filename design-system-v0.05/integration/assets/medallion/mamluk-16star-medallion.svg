<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <style>
    .scaffold { stroke: var(--sand, #D5C4A8); stroke-width: 1; stroke-dasharray: 4,4; fill: none; opacity: 0.8; }
    .ink-line { stroke: var(--ink, #140206); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .heavy-line { stroke: var(--ink, #140206); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .blue-line { stroke: var(--nile, #1034A6); stroke-width: 2; fill: none; }
    .pink-line { stroke: var(--pink, #FF6183); stroke-width: 2; fill: none; }
    .star-fill-paper { fill: var(--paper, #F7F4EF); stroke: var(--ink, #140206); stroke-width: 1.5; }
    .star-fill-warm { fill: var(--warm, #EAE5DE); stroke: var(--ink, #140206); stroke-width: 1.5; }
    .star-fill-blue { fill: var(--nile, #1034A6); stroke: var(--ink, #140206); stroke-width: 1.5; }
    .star-fill-pink { fill: var(--pink, #FF6183); stroke: var(--ink, #140206); stroke-width: 1.5; }
    .star-fill-sand { fill: var(--sand, #D5C4A8); stroke: var(--ink, #140206); stroke-width: 1.5; }
    .star-fill-ink { fill: var(--ink, #140206); stroke: var(--paper, #F7F4EF); stroke-width: 1.5; }
    .ribbon { fill: none; stroke: var(--ink, #140206); stroke-width: 6; }
    .ribbon-inner { fill: none; stroke: var(--paper, #F7F4EF); stroke-width: 3; }
  </style>
  
  
